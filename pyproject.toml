[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "water-segmentation"
version = "0.1.0"
description = "Binary segmentation of water bodies from satellite imagery"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "segmentation-models-pytorch>=0.3.3",
    "albumentations>=1.3.0",
    "mlflow>=2.12.0",
    "opencv-python-headless>=4.7.0",
    "numpy>=1.24.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.16.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
    "kagglehub>=0.3.0",
]

[project.scripts]
water-seg = "src.inference.inference:main"
[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/training"]
python_files = ["test_*.py", "tests.py"]
markers = [
    "api: tests for the FastAPI inference server",
    "mlflow: tests for MLflow experiment tracking",
    "docker: tests for container build and runtime",
]
